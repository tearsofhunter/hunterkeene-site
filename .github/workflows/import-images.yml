name: Import project images

# Downloads project images from hunterkeene.com (Adobe Portfolio) and Behance
# into images/<project>/ and commits them. Runs when the import list changes,
# or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/import_sources.json
      - tools/import_images.py

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: pip install pillow
      - name: Download images
        run: python3 tools/import_images.py
      - name: Commit images
        run: |
          git config user.name "Hunter Keene"
          git config user.email "hunterjkeene@gmail.com"
          git add images
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Import project images from Adobe Portfolio and Behance"
            git push
          fi
